# The paper's stated NCVR design: a 50,000-record spine and an incoming file of
# 10,000 records (20%), each with exactly one true match in the spine.
name: NCVR
source:
  file: ncvoter-20231002_minimal_50k.csv
max_rows: 50000
incoming:
  fraction: 0.2
  seed: 20231003
columns:
  id: ncid
  forename: first_name
  surname: last_name
subgroup:
  name: ethnic_group
  column: ethnicity
  coding: ncvr_collapsed
  reference_group: Non-Hispanic White

observed_corruption:
  seed: 20231002
  forename_error_rate: 0.19
  surname_error_rate: 0.21
  multi_field_error_rate: 0.08
  full_surname_replacement_rate: 0.10

linkage:
  blocking_rules:
    - [surname_prefix2, forename_prefix2]
    - [surname_prefix2, forename_initial, surname_len_bin]
  scoring:
    intercept: -7.0
    forename_weight: 3.0
    surname_weight: 5.0
    exact_forename_bonus: 1.0
    exact_surname_bonus: 1.5
