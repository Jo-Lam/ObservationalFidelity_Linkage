[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ofeval"
version = "1.0.0"
description = "Observational Fidelity for synthetic data linkage evaluation"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2,<3",
    "rapidfuzz>=3",
    "matplotlib>=3.8",
    "pyyaml>=6",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ofeval = "ofeval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
